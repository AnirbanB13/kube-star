apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: np-demo
  labels:
    app: frontend
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"