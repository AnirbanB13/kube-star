apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ingress-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ingress-demo
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 80