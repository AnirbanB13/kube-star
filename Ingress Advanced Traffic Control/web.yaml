apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ingress-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ingress-demo
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80