apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  namespace: ingress-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-canary
  template:
    metadata:
      labels:
        app: web-canary
    spec:
      containers:
        - name: web-canary
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: web-canary
  namespace: ingress-demo
spec:
  selector:
    app: web-canary
  ports:
    - port: 80
      targetPort: 80